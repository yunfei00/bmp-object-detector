name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Build EXE
        run: pyinstaller build.spec --noconfirm --clean

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BMPObjectDetector.exe")) {
            Write-Error "dist/BMPObjectDetector.exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMPObjectDetector-windows
          path: dist/BMPObjectDetector.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/BMPObjectDetector.exe
